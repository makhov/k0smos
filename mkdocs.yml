site_name: k0smos
site_description: A minimal Go PID1 that boots k0s Kubernetes nodes.
site_url: https://makhov.github.io/k0smos/
docs_dir: docs/
repo_name: GitHub
repo_url: https://github.com/makhov/k0smos
edit_uri: ""

nav:
  - Overview: index.md
  - Get started: install/quick-start.md
  - Use locally:
      - Local clusters: usage/cluster.md
      - Local machines: usage/boot.md
      - Machine configuration: usage/cloud-init.md
  - Deploy:
      - Artifacts and releases: deployment/artifacts.md
      - KubeVirt and Cluster API: deployment/kubevirt.md
      - Bare metal and Metal3: deployment/bare-metal.md
  - Operate: deployment/operating.md
  - Support status: known-limitations.md
  - Troubleshooting: troubleshooting.md
  - Reference:
      - k0smosctl: reference/k0smosctl.md
      - Kernel parameters: reference/cmdline.md
  - Internals:
      - Boot chain: design/boot-chain.md
      - Design decisions: design/decisions.md

theme:
  name: "material"
  custom_dir: docs/custom_theme
  highlightjs: true
  language: "en"
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode
  features:
    - toc.autohide
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - macros:
      j2_variable_start_string: "{{{"
      j2_variable_end_string: "}}}"
      j2_block_start_string: "[[%"
      j2_block_end_string: "%]]"
      modules:
        - mkdocs_modules.k0smos_macros
  - exclude:
      glob:
        - superpowers/*
        - superpowers/**/*
        - requirements*.txt
        - Makefile*
        - Dockerfile.serve-dev
        - mkdocs_modules/*
        - custom_theme/*

markdown_extensions:
  - attr_list
  - pymdownx.highlight: {}
  - pymdownx.superfences: {}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite: {}
  - mdx_truly_sane_lists:
      nested_indent: 2
      truly_sane: true
  - toc:
      permalink: "#"
      toc_depth: 3
  - admonition
  - footnotes

extra:
  generator: false
  version:
    provider: mike
    default: stable
