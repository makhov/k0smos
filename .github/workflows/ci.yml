name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, for the slow k0s boots and the modular-kernel path.
    - cron: "0 3 * * *"

env:
  # Pinned so the k0s download is cacheable. fetch-k0s.sh otherwise resolves
  # "latest", which would change under the cache key.
  K0S_VERSION: v1.36.3+k0s.0

jobs:
  # Fast and hermetic: no VM, no root, no network beyond the module cache.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: vet (host and linux target)
        run: make vet

      - name: unit tests
        run: go test -race ./...

      # The e2e package only builds under its tag, so nothing else type-checks
      # it. Without this a broken harness lands unnoticed — which has happened.
      - name: vet e2e harness
        run: go vet -tags e2e ./e2e/

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal e2e)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: shell syntax
        run: for f in image/*.sh; do bash -n "$f"; done

      - name: manifests parse
        run: |
          python3 -c "
          import yaml, sys
          for f in ['examples/capi-kubevirt.yaml', 'image/kubevirt-vm.yaml']:
              docs = [d for d in yaml.safe_load_all(open(f)) if d]
              print(f, len(docs), 'documents')
          "

  # Boots k0smos under QEMU. Uses the Kata kernel: pinned by digest, monolithic
  # (so no module tree and a ~1.2MB initramfs), and quick to boot.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The Kata kernel has no modules; building with a module tree would leave
      # a stale one and trigger the version-skew warning.
      MODULES_DIR: /nonexistent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso e2fsprogs
          # Without KVM, QEMU drops to TCG and the boot timeouts will not hold.
          ls -l /dev/kvm || echo "::warning::no /dev/kvm — boots will be slow"

      # Keyed on the fetch script, which carries the pinned version and digests:
      # bumping either invalidates the cache, and nothing else does.
      - name: cache kernel
        uses: actions/cache@v4
        with:
          path: dist/kernel
          key: kata-kernel-${{ runner.arch }}-${{ hashFiles('image/fetch-kernel-kata.sh') }}

      # ~256MB per download, so worth keeping. Keyed on the pinned version.
      - name: cache k0s binary
        uses: actions/cache@v4
        with:
          path: dist/k0s-*
          key: k0s-${{ runner.arch }}-${{ env.K0S_VERSION }}

      - name: build artifacts
        run: |
          make kernel-kata
          make k0s
          ./image/mkinitramfs.sh
          K0S_BIN=dist/k0s-$(go env GOARCH) ./image/mkrootfs.sh dist/k0smos.img

      - name: e2e (fast)
        run: go test -tags e2e -short -v -timeout 40m ./e2e/

      - name: keep consoles from failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-consoles
          path: dist/e2e/*.console.log
          if-no-files-found: ignore

  # The k0s boots, several minutes each, plus the modular-kernel path. Nightly
  # rather than per-push.
  #
  # Deliberately uses Alpine's kernel: it is the only thing that exercises
  # internal/module — dependency resolution, softdeps, alias lookup — which the
  # Kata path skips entirely. Without this that code would stop being tested.
  e2e-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kernel: [kata, alpine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso e2fsprogs
          ls -l /dev/kvm || echo "::warning::no /dev/kvm — boots will be slow"

      - name: cache k0s binary
        uses: actions/cache@v4
        with:
          path: dist/k0s-*
          key: k0s-${{ runner.arch }}-${{ env.K0S_VERSION }}

      - name: build artifacts (${{ matrix.kernel }} kernel)
        run: |
          make k0s
          if [ "${{ matrix.kernel }}" = "kata" ]; then
            make kernel-kata
            export MODULES_DIR=/nonexistent
          else
            make kernel
          fi
          ./image/mkinitramfs.sh
          K0S_BIN=dist/k0s-$(go env GOARCH) ./image/mkrootfs.sh dist/k0smos.img

      # make disk is not used here, so the root image is freshly built and
      # therefore pristine — the k0s tests skip against one holding cluster state.
      - name: e2e (with k0s)
        run: go test -tags e2e -v -timeout 110m ./e2e/

      - name: keep consoles from failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-k0s-consoles-${{ matrix.kernel }}
          path: dist/e2e/*.console.log
          if-no-files-found: ignore
