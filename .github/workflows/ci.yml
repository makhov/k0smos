name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, for the slow k0s boots and the modular-kernel path.
    - cron: "0 0 * * *"

env:
  # Pinned so the k0s download is cacheable. fetch-k0s.sh otherwise resolves
  # "latest", which would change under the cache key.
  K0S_VERSION: v1.36.3+k0s.0

jobs:
  # Fast and hermetic: no VM, no root, no network beyond the module cache.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: vet (host and linux target)
        run: make vet

      - name: unit tests
        run: go test -race ./...

      # The e2e package only builds under its tag, so nothing else type-checks
      # it. Without this a broken harness lands unnoticed — which has happened.
      - name: vet e2e harness
        run: go vet -tags e2e ./e2e/

      # k0smosctl pulls in cobra; the node binary must not. It runs as PID1 in an
      # image specified to hold almost nothing, so its dependency set is a
      # property worth enforcing rather than trusting.
      - name: node binary stays dependency-light
        run: |
          if GOOS=linux go list -deps ./cmd/k0smos | grep -E 'spf13|cobra'; then
            echo "::error::a CLI dependency reached the node binary"
            exit 1
          fi

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal e2e)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: shell syntax
        run: for f in image/*.sh; do bash -n "$f"; done

      - name: manifests parse
        run: |
          python3 -c "
          import yaml, sys
          for f in ['examples/capi-kubevirt.yaml', 'examples/capi-metal3-image.yaml',
                    'image/kubevirt-vm.yaml']:
              docs = [d for d in yaml.safe_load_all(open(f)) if d]
              print(f, len(docs), 'documents')
          "

  # Boots the released bare-metal shape through real firmware. No -kernel or
  # -initrd shortcut: this covers GPT, UEFI, GRUB, modular hardware discovery,
  # the EROFS root partition, writable data partition, and k0s supervision.
  metal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install firmware test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ovmf qemu-system-x86 qemu-utils

      - name: build metal artifact
        env:
          ARCH: x86_64
          METAL_DATA_MB: "2048"
        run: make metal

      - name: boot through UEFI
        run: |
          make ctl
          ./image/test-metal.sh dist/k0smos-metal-x86_64.qcow2

  # Boots k0smos under QEMU on both kernels. They cover different configurations
  # rather than the same one twice, and neither is redundant.
  #
  # kata — the default, and the only leg that boots what this repository actually
  #   ships: a read-only erofs root carried inside the initramfs, loop-attached,
  #   with the data volume at /var. Monolithic, so it also proves no kernel
  #   filesystem support is needed to read a cloud-init drive.
  #
  # alpine — a modular kernel booting from an ext4 disk. The only leg that runs
  #   internal/module for real: modules.dep, softdep and alias resolution, ~63
  #   modules, plus modalias autoloading, all of which are a no-op on a monolithic
  #   kernel. It is also the only leg exercising switch_root from a named disk
  #   (LABEL=), which is what bare metal will need. This is the leg that catches
  #   "works only where everything is built in" — loop being a module was found
  #   exactly here.
  #
  #   Alpine 3.23 enables EROFS as a module. This leg still names the ext4 disk
  #   explicitly to retain coverage of the writable-root path; the separate metal
  #   job covers modular EROFS from a GPT partition.
  #
  # The legs run in parallel, so covering both costs no wall-clock.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kernel: [alpine, kata]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso e2fsprogs
          # Without KVM, QEMU drops to TCG and the boot timeouts will not hold.
          ls -l /dev/kvm || echo "::warning::no /dev/kvm — boots will be slow"

      # Keyed on the fetch script, which carries the pinned version and digests:
      # bumping either invalidates the cache, and nothing else does.
      # ~256MB per download, so worth keeping. Keyed on the pinned version.
      - name: cache k0s binary
        uses: actions/cache@v4
        with:
          path: dist/k0s-*
          key: k0s-${{ runner.arch }}-${{ env.K0S_VERSION }}

      # `make e2e-artifacts` rather than the individual scripts: the kernel is
      # chosen above, and everything after it — which root formats, in which order,
      # and which one the initramfs embeds — is the Makefile's business. Spelling it
      # out here is what let CI drift into building an erofs image named
      # k0smos.img, after which every test that boots it by LABEL waited out its
      # three-minute timeout.
      - name: build artifacts
        run: |
          if [ "${{ matrix.kernel }}" = alpine ]; then
            make kernel-alpine
          else
            # Default: Kata's monolithic kernel, which writes no module tree.
            make kernel
          fi
          make e2e-artifacts

      - name: e2e (fast)
        run: go test -tags e2e -short -failfast -v -timeout 40m ./e2e/

      - name: keep consoles from failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-consoles-${{ matrix.kernel }}
          path: dist/e2e/*.console.log
          if-no-files-found: ignore

  # The k0s boots, several minutes each. Nightly rather than per-push.
  #
  # Alpine's kernel only: this leg is about k0s reaching Ready, and one kernel is
  # enough for that. The gate already covers both.
  e2e-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso e2fsprogs
          ls -l /dev/kvm || echo "::warning::no /dev/kvm — boots will be slow"

      # Both are cached on the same key: the airgap bundle is ~350MB and pinned to
      # the same k0s release as the binary, so they go stale together.
      - name: cache k0s binary and airgap bundle
        uses: actions/cache@v4
        with:
          path: dist/k0s-*
          key: k0s-${{ runner.arch }}-${{ env.K0S_VERSION }}

      # Without this every node pulls its images over QEMU's user-mode network,
      # observed between 5 and 13 minutes per node. With it they are imported from
      # the volume and nothing is pulled at all. The three-node test skips outright
      # when the bundle is absent, because three nodes pulling is not worth waiting
      # for.
      - name: fetch the k0s airgap bundle
        run: ./image/fetch-airgap.sh

      - name: build artifacts
        run: |
          make kernel-alpine
          make e2e-artifacts

      # make disk is not used here, so the root image is freshly built and
      # therefore pristine — the k0s tests skip against one holding cluster state.
      # -failfast for the same reason as the gate, and it matters more here: a k0s
      # boot waits up to 25 minutes, so two broken ones exceed the whole timeout.
      #
      # 110m is a backstop, not a budget. The three-node cluster test is the long
      # pole now that the airgap bundle has removed the image pulls.
      #
      # 3GB a node: a 16GB runner cannot give three guests the 4GB they get locally,
      # and the test skips itself rather than being OOM-killed halfway through.
      - name: e2e (with k0s)
        env:
          K0SMOS_E2E_CLUSTER_MEM: "3072"
        run: go test -tags e2e -failfast -v -timeout 110m ./e2e/

      - name: keep consoles from failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-k0s-consoles
          path: dist/e2e/*.console.log
          if-no-files-found: ignore
