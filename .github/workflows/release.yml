name: Release k0smos artifacts

on:
  repository_dispatch:
    types: [k0s-release]
  schedule:
    # k0s does not publish on a fixed cadence. Poll daily and create only
    # release sets that do not already exist.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      k0s_version:
        description: "Exact k0s release tag, or 'latest'"
        required: false
        default: latest

permissions:
  contents: write
  packages: write

# Serializing release discovery closes the race where two runs resolve the same
# new upstream release before either has created the k0smos release.
concurrency:
  group: k0smos-k0s-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve k0s release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      oci_version: ${{ steps.version.outputs.oci_version }}
      exists: ${{ steps.version.outputs.exists }}
      draft: ${{ steps.version.outputs.draft }}
    steps:
      - name: Resolve and validate version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.event.client_payload.k0s_version || inputs.k0s_version || 'latest' }}
        shell: bash
        run: |
          set -euo pipefail

          version="$REQUESTED_VERSION"
          if [[ -z "$version" || "$version" == "latest" ]]; then
            version="$(gh api repos/k0sproject/k0s/releases/latest --jq .tag_name)"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+k0s\.[0-9]+$ ]]; then
            echo "Invalid k0s release tag: $version" >&2
            exit 1
          fi

          encoded_version="${version//+/%2B}"
          gh api "repos/k0sproject/k0s/releases/tags/$encoded_version" >/dev/null

          if release_state="$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$release_state" == "true" ]]; then
              exists=false
              draft=true
            else
              exists=true
              draft=false
            fi
          else
            exists=false
            draft=false
          fi

          # '+' is part of a valid k0s/GitHub tag, but is not valid in an OCI tag.
          oci_version="${version//+/-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "oci_version=$oci_version" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

          {
            echo "### k0smos release set"
            echo
            echo "- k0s release: \`$version\`"
            echo "- OCI version: \`$oci_version\`"
            echo "- already published: \`$exists\`"
            echo "- resumable draft: \`$draft\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.arch }} release set
    needs: resolve
    if: needs.resolve.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            goarch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ARCH: ${{ matrix.arch }}
      K0S_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils zstd

      - name: Build canonical root and platform wrappers
        run: |
          set -euo pipefail
          make build
          make metal
          make kernel
          make initramfs
          ./image/verify-artifacts.sh

      - name: Smoke-test firmware boot
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get install -y --no-install-recommends ovmf qemu-system-x86
          make ctl
          ./image/test-metal.sh dist/k0smos-metal-x86_64.qcow2
          # The same image through legacy BIOS (SeaBIOS), as most VMs still boot.
          FIRMWARE=bios ./image/test-metal.sh dist/k0smos-metal-x86_64.qcow2

      - name: Package release artifacts
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp dist/k0smos.erofs "out/k0smos-root-${RELEASE_ARCH}.erofs"
          cp dist/k0smos-initramfs.gz "out/k0smos-initramfs-${RELEASE_ARCH}.gz"
          cp "dist/k0smos-metal-${RELEASE_ARCH}.qcow2" "out/k0smos-metal-${RELEASE_ARCH}.qcow2"
          zstd -12 -T0 -f \
            "dist/metal-${RELEASE_ARCH}/k0smos-metal-${RELEASE_ARCH}.raw" \
            -o "out/k0smos-metal-${RELEASE_ARCH}.raw.zst"

          root_sha256="$(sha256sum dist/k0smos.erofs | cut -d' ' -f1)"
          {
            echo "k0s_version=$K0S_VERSION"
            echo "k0smos_commit=$GITHUB_SHA"
            echo "architecture=$RELEASE_ARCH"
            echo "root_sha256=$root_sha256"
          } > "out/k0smos-${RELEASE_ARCH}.manifest"

          cd out
          qcow2="k0smos-metal-${RELEASE_ARCH}.qcow2"
          sha256sum "$qcow2" > "$qcow2.sha256"
          sha256sum \
            "k0smos-root-${RELEASE_ARCH}.erofs" \
            "k0smos-initramfs-${RELEASE_ARCH}.gz" \
            "$qcow2" \
            "k0smos-metal-${RELEASE_ARCH}.raw.zst" \
            "k0smos-${RELEASE_ARCH}.manifest" \
            > "SHA256SUMS-${RELEASE_ARCH}.txt"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push KubeVirt OCI artifact
        env:
          OCI_VERSION: ${{ needs.resolve.outputs.oci_version }}
          PUSH: "1"
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          TAG="${OCI_VERSION}-${{ matrix.goarch }}" ./image/mkoci.sh

  gpu:
    # The GPU images are a build, not a rebuild: one driver branch per leg, each
    # pinned to the kernel in the Makefile. Shipping them is what makes the
    # driver a choice a user downloads rather than one they have to build.
    name: Build NVIDIA ${{ matrix.nvidia }} release set
    needs: resolve
    if: needs.resolve.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        # The two long-term support branches, as in docs/deployment/gpus.md.
        nvidia: ["620.70.06", "580.196.07"]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARCH: x86_64
      K0S_VERSION: ${{ needs.resolve.outputs.version }}
      NVIDIA_VERSION: ${{ matrix.nvidia }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils zstd

      - name: Build the GPU metal image
        run: |
          set -euo pipefail
          make build
          make metal-nvidia

      - name: Smoke-test firmware boot
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends ovmf qemu-system-x86
          make ctl
          # No GPU on a runner, so this proves the image still boots with the
          # extra driver partition and finds its root -- not that CUDA works.
          ./image/test-metal.sh "dist/k0smos-metal-nvidia-${NVIDIA_VERSION}-x86_64.qcow2"

      - name: Package release artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          name="k0smos-metal-nvidia-${NVIDIA_VERSION}-x86_64"
          cp "dist/$name.qcow2" "out/$name.qcow2"
          zstd -12 -T0 -f \
            "dist/metal-nvidia-${NVIDIA_VERSION}/k0smos-metal-x86_64.raw" \
            -o "out/$name.raw.zst"
          {
            echo "k0s_version=$K0S_VERSION"
            echo "k0smos_commit=$GITHUB_SHA"
            echo "architecture=x86_64"
            echo "nvidia_version=$NVIDIA_VERSION"
          } > "out/$name.manifest"
          cd out
          sha256sum "$name.qcow2" "$name.raw.zst" "$name.manifest" \
            > "SHA256SUMS-nvidia-${NVIDIA_VERSION}.txt"

      # Named release-* so the publish job's existing download pattern picks it up.
      - uses: actions/upload-artifact@v4
        with:
          name: release-nvidia-${{ matrix.nvidia }}
          path: out/*
          if-no-files-found: error

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the KubeVirt OCI artifact
        env:
          OCI_VERSION: ${{ needs.resolve.outputs.oci_version }}
          PUSH: "1"
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Builds the KubeVirt initramfs and pushes it; the driver and the
          # modules are reused from the metal build above. The Makefile appends
          # -nvidia-$NVIDIA_VERSION, and x86_64 is the only architecture, so the
          # tag carries no architecture suffix.
          make oci-nvidia TAG="${OCI_VERSION}"

  cli:
    name: Build k0smosctl
    needs: resolve
    if: needs.resolve.outputs.exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      K0S_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build host binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          # Asset names use uname's spelling, not Go's, so that the documented
          # one-liner works unchanged on every host:
          #   k0smosctl-$(uname -s | tr A-Z a-z)-$(uname -m)
          for target in \
            "linux amd64 x86_64" \
            "linux arm64 aarch64" \
            "darwin amd64 x86_64" \
            "darwin arm64 arm64"
          do
            read -r goos goarch uname_m <<<"$target"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -ldflags "-s -w -X main.version=${K0S_VERSION}" \
              -o "out/k0smosctl-${goos}-${uname_m}" \
              ./cmd/k0smosctl
          done

          cd out
          sha256sum k0smosctl-* > SHA256SUMS-k0smosctl.txt

      - name: Check the built CLI runs and reports its version
        shell: bash
        run: |
          set -euo pipefail
          got="$(./out/k0smosctl-linux-x86_64 --version)"
          echo "$got"
          # A binary that reports "dev" means the stamp silently stopped working.
          [[ "$got" == *"$K0S_VERSION"* ]]

      # Named release-* so the publish job's existing download pattern picks it up.
      - uses: actions/upload-artifact@v4
        with:
          name: release-cli
          path: out/*
          if-no-files-found: error

  release:
    name: Publish k0s ${{ needs.resolve.outputs.version }} release set
    needs: [resolve, build, gpu, cli]
    if: >-
      needs.resolve.outputs.exists != 'true'
      && needs.build.result == 'success'
      && needs.gpu.result == 'success'
      && needs.cli.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          K0S_VERSION: ${{ needs.resolve.outputs.version }}
          OCI_VERSION: ${{ needs.resolve.outputs.oci_version }}
          EXISTING_DRAFT: ${{ needs.resolve.outputs.draft }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "This is the k0smos artifact set for upstream k0s \`$K0S_VERSION\`."
            echo
            echo "Every image in this release embeds that exact k0s version and the same immutable EROFS root for its architecture. The KubeVirt OCI images are \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/k0smos:${OCI_VERSION}-amd64\` and \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/k0smos:${OCI_VERSION}-arm64\`."
            echo
            echo "### GPU images"
            echo
            echo "\`k0smos-metal-nvidia-<driver>-x86_64.qcow2\` carries NVIDIA's data center driver, so the GPU Operator runs with \`driver.enabled=false\`. Pick a long-term support branch: \`620.70.06\` or \`580.196.07\`. The matching KubeVirt images are \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/k0smos:${OCI_VERSION}-nvidia-620.70.06\` and \`…-nvidia-580.196.07\`."
            echo
            echo "### Install the CLI"
            echo
            echo '```bash'
            echo "curl -sSLo k0smosctl https://github.com/${GITHUB_REPOSITORY}/releases/download/${K0S_VERSION//+/%2B}/k0smosctl-\$(uname -s | tr A-Z a-z)-\$(uname -m)"
            echo "chmod +x k0smosctl && sudo mv k0smosctl /usr/local/bin/"
            echo '```'
            echo
            echo "Then \`k0smosctl cluster create --name dev\`."
          } > release-notes.md

          if [[ "$EXISTING_DRAFT" != "true" ]]; then
            gh release create "$K0S_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "k0smos for k0s $K0S_VERSION" \
              --notes-file release-notes.md \
              --draft
          fi

          # Upload while the release is hidden. A failed run leaves a resumable
          # draft instead of exposing an incomplete platform artifact set.
          gh release upload "$K0S_VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$K0S_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "k0smos for k0s $K0S_VERSION" \
            --notes-file release-notes.md \
            --draft=false

  docs:
    # The docs for this version, deployed here rather than from publish-docs.yml:
    # that workflow's `release: published` trigger can never fire, because this
    # one publishes the release with GITHUB_TOKEN and GitHub does not start
    # workflow runs from events made with that token. The result was a site that
    # only ever had `head` on it.
    #
    # A failure here leaves the release published and the docs behind, which is
    # the right way round.
    name: Publish docs for ${{ needs.resolve.outputs.version }}
    needs: [resolve, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same group publish-docs.yml uses: both push to gh-pages, and the
    # loser of a race gets a non-fast-forward rejection.
    concurrency:
      group: k0smos-docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r docs/requirements_pip.txt
          pip install --disable-pip-version-check -r docs/requirements.txt

      - name: git config
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Deploy this version's docs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          make -C docs docs
          # stable follows the newest published release, which a scheduled run
          # always is -- but a workflow_dispatch can ask for an older k0s, and
          # that must not drag the site's default backwards.
          NEWEST=$(gh release list -L 100 --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[].tagName' | sort -V | tail -1)
          if [ "$NEWEST" = "$VERSION" ]; then
            K0SMOS_VERSION="$VERSION" mike deploy --push --update-aliases "$VERSION" stable
            mike set-default --push stable
          else
            echo "$NEWEST is newer than $VERSION; deploying without moving stable"
            K0SMOS_VERSION="$VERSION" mike deploy --push "$VERSION"
          fi
