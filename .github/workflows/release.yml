name: Release k0smos artifacts

on:
  repository_dispatch:
    types: [k0s-release]
  schedule:
    # k0s does not publish on a fixed cadence. Poll daily and create only
    # release sets that do not already exist.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      k0s_version:
        description: "Exact k0s release tag, or 'latest'"
        required: false
        default: latest

permissions:
  contents: write
  packages: write

# Serializing release discovery closes the race where two runs resolve the same
# new upstream release before either has created the k0smos release.
concurrency:
  group: k0smos-k0s-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve k0s release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      oci_version: ${{ steps.version.outputs.oci_version }}
      exists: ${{ steps.version.outputs.exists }}
      draft: ${{ steps.version.outputs.draft }}
    steps:
      - name: Resolve and validate version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.event.client_payload.k0s_version || inputs.k0s_version || 'latest' }}
        shell: bash
        run: |
          set -euo pipefail

          version="$REQUESTED_VERSION"
          if [[ -z "$version" || "$version" == "latest" ]]; then
            version="$(gh api repos/k0sproject/k0s/releases/latest --jq .tag_name)"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+k0s\.[0-9]+$ ]]; then
            echo "Invalid k0s release tag: $version" >&2
            exit 1
          fi

          encoded_version="${version//+/%2B}"
          gh api "repos/k0sproject/k0s/releases/tags/$encoded_version" >/dev/null

          if release_state="$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$release_state" == "true" ]]; then
              exists=false
              draft=true
            else
              exists=true
              draft=false
            fi
          else
            exists=false
            draft=false
          fi

          # '+' is part of a valid k0s/GitHub tag, but is not valid in an OCI tag.
          oci_version="${version//+/-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "oci_version=$oci_version" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

          {
            echo "### k0smos release set"
            echo
            echo "- k0s release: \`$version\`"
            echo "- OCI version: \`$oci_version\`"
            echo "- already published: \`$exists\`"
            echo "- resumable draft: \`$draft\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.arch }} release set
    needs: resolve
    if: needs.resolve.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            goarch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ARCH: ${{ matrix.arch }}
      K0S_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils zstd

      - name: Build canonical root and platform wrappers
        run: |
          set -euo pipefail
          make build
          make metal
          make kernel
          make initramfs
          ./image/verify-artifacts.sh

      - name: Smoke-test firmware boot
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get install -y ovmf qemu-system-x86
          make ctl
          ./image/test-metal.sh dist/k0smos-metal-x86_64.qcow2

      - name: Package release artifacts
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp dist/k0smos.erofs "out/k0smos-root-${RELEASE_ARCH}.erofs"
          cp dist/k0smos-initramfs.gz "out/k0smos-initramfs-${RELEASE_ARCH}.gz"
          cp "dist/k0smos-metal-${RELEASE_ARCH}.qcow2" "out/k0smos-metal-${RELEASE_ARCH}.qcow2"
          zstd -12 -T0 -f \
            "dist/metal-${RELEASE_ARCH}/k0smos-metal-${RELEASE_ARCH}.raw" \
            -o "out/k0smos-metal-${RELEASE_ARCH}.raw.zst"

          root_sha256="$(sha256sum dist/k0smos.erofs | cut -d' ' -f1)"
          {
            echo "k0s_version=$K0S_VERSION"
            echo "k0smos_commit=$GITHUB_SHA"
            echo "architecture=$RELEASE_ARCH"
            echo "root_sha256=$root_sha256"
          } > "out/k0smos-${RELEASE_ARCH}.manifest"

          cd out
          qcow2="k0smos-metal-${RELEASE_ARCH}.qcow2"
          sha256sum "$qcow2" > "$qcow2.sha256"
          sha256sum \
            "k0smos-root-${RELEASE_ARCH}.erofs" \
            "k0smos-initramfs-${RELEASE_ARCH}.gz" \
            "$qcow2" \
            "k0smos-metal-${RELEASE_ARCH}.raw.zst" \
            "k0smos-${RELEASE_ARCH}.manifest" \
            > "SHA256SUMS-${RELEASE_ARCH}.txt"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push KubeVirt OCI artifact
        env:
          OCI_VERSION: ${{ needs.resolve.outputs.oci_version }}
          PUSH: "1"
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          TAG="${OCI_VERSION}-${{ matrix.goarch }}" ./image/mkoci.sh

  cli:
    name: Build k0smosctl
    needs: resolve
    if: needs.resolve.outputs.exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      K0S_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build host binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          # Asset names use uname's spelling, not Go's, so that the documented
          # one-liner works unchanged on every host:
          #   k0smosctl-$(uname -s | tr A-Z a-z)-$(uname -m)
          for target in \
            "linux amd64 x86_64" \
            "linux arm64 aarch64" \
            "darwin amd64 x86_64" \
            "darwin arm64 arm64"
          do
            read -r goos goarch uname_m <<<"$target"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -ldflags "-s -w -X main.version=${K0S_VERSION}" \
              -o "out/k0smosctl-${goos}-${uname_m}" \
              ./cmd/k0smosctl
          done

          cd out
          sha256sum k0smosctl-* > SHA256SUMS-k0smosctl.txt

      - name: Check the built CLI runs and reports its version
        shell: bash
        run: |
          set -euo pipefail
          got="$(./out/k0smosctl-linux-x86_64 --version)"
          echo "$got"
          # A binary that reports "dev" means the stamp silently stopped working.
          [[ "$got" == *"$K0S_VERSION"* ]]

      # Named release-* so the publish job's existing download pattern picks it up.
      - uses: actions/upload-artifact@v4
        with:
          name: release-cli
          path: out/*
          if-no-files-found: error

  release:
    name: Publish k0s ${{ needs.resolve.outputs.version }} release set
    needs: [resolve, build, cli]
    if: >-
      needs.resolve.outputs.exists != 'true'
      && needs.build.result == 'success'
      && needs.cli.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          K0S_VERSION: ${{ needs.resolve.outputs.version }}
          OCI_VERSION: ${{ needs.resolve.outputs.oci_version }}
          EXISTING_DRAFT: ${{ needs.resolve.outputs.draft }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "This is the k0smos artifact set for upstream k0s \`$K0S_VERSION\`."
            echo
            echo "Every image in this release embeds that exact k0s version and the same immutable EROFS root for its architecture. The KubeVirt OCI images are \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/k0smos:${OCI_VERSION}-amd64\` and \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/k0smos:${OCI_VERSION}-arm64\`."
            echo
            echo "### Install the CLI"
            echo
            echo '```bash'
            echo "curl -sSLo k0smosctl https://github.com/${GITHUB_REPOSITORY}/releases/download/${K0S_VERSION//+/%2B}/k0smosctl-\$(uname -s | tr A-Z a-z)-\$(uname -m)"
            echo "chmod +x k0smosctl && sudo mv k0smosctl /usr/local/bin/"
            echo '```'
            echo
            echo "Then \`k0smosctl cluster create --name dev\`."
          } > release-notes.md

          if [[ "$EXISTING_DRAFT" != "true" ]]; then
            gh release create "$K0S_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "k0smos for k0s $K0S_VERSION" \
              --notes-file release-notes.md \
              --draft
          fi

          # Upload while the release is hidden. A failed run leaves a resumable
          # draft instead of exposing an incomplete platform artifact set.
          gh release upload "$K0S_VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$K0S_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "k0smos for k0s $K0S_VERSION" \
            --notes-file release-notes.md \
            --draft=false
