# Image portion of a CAPM3 machine template. The surrounding Cluster,
# Metal3Cluster and k0smotron control-plane/worker resources are deployment
# specific; this is the platform-artifact contract k0smos owns.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: Metal3MachineTemplate
metadata:
  name: k0smos-metal
spec:
  template:
    spec:
      image:
        url: https://images.example.com/k0smos-metal-x86_64.qcow2
        format: qcow2
        checksumType: sha256
        checksum: https://images.example.com/k0smos-metal-x86_64.qcow2.sha256
