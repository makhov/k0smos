# A KubeVirt VM booting k0smos. Standalone example — under Cluster API the
# equivalent fields live in the KubevirtMachineTemplate, and cloudInitNoCloud
# is populated by CAPK from the bootstrap Secret rather than written by hand.
#
# Field names verified against kubevirt.io/api/core/v1: KernelBoot{KernelArgs,
# Container{Image, KernelPath, InitrdPath}}.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: k0smos-0
spec:
  runStrategy: Always
  template:
    spec:
      domain:
        cpu:
          cores: 4
        memory:
          guest: 8Gi
        firmware:
          kernelBoot:
            # Direct kernel boot: the initramfs is k0smos, which loads the
            # storage modules, loop-attaches the read-only erofs root it carries,
            # and switch_roots onto it. No k0smos.root= is needed: there is no
            # device to name, and the filesystem is detected from its superblock.
            kernelArgs: "console=ttyS0 k0smos.ip=dhcp k0smos.data=auto"
            # This image is the whole node — kernel and initramfs, nothing else to
            # keep in step.
            container:
              image: ghcr.io/amakhov/k0smos:dev
              kernelPath: /boot/vmlinuz
              initrdPath: /boot/initramfs.gz
        devices:
          disks:
            - name: bootstrap
              disk:
                bus: virtio
            - name: data
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        # No root volume: the initramfs carries the read-only erofs root, so the
        # kernelBoot container above is the whole node.
        #
        # Mutable /var. Required, not optional — with a read-only root there is
        # nowhere else for k0s's state, kubelet's or containerd's images to go.
        # emptyDisk shares the VMI lifecycle:
        # kept across a guest reboot, gone when the VM is deleted.
        - name: data
          emptyDisk:
            capacity: 20Gi
        # Cloud-init bootstrap data. CAPK fills this from the bootstrap Secret;
        # k0smos finds the drive by its "cidata" label, applies write_files, and
        # takes the k0s role and args from the k0s install line in runcmd.
        - name: bootstrap
          cloudInitNoCloud:
            userData: |
              #cloud-config
              write_files:
                - path: /etc/k0s/k0s.yaml
                  permissions: "0644"
                  content: |
                    apiVersion: k0s.k0sproject.io/v1beta1
                    kind: ClusterConfig
                    spec:
                      storage:
                        type: kine
              runcmd:
                - /usr/local/bin/k0s install controller --single --config /etc/k0s/k0s.yaml
                - /usr/local/bin/k0s start
            networkData: |
              version: 2
              ethernets:
                eth0:
                  dhcp4: true
---
# Notes for the Cluster API path (CAPK + k0smotron):
#
#   * Set preInstalledK0s: true in the K0sControllerConfig/K0sWorkerConfig spec.
#     k0smotron's DownloadCommands returns nothing when it is set, so no
#     curl/wget commands are emitted — the image already ships k0s.
#
#   * k0smos interprets runcmd rather than executing it. `k0s install <role>`
#     becomes the supervised workload, install-only flags (--force) are dropped,
#     and `--env KEY=VALUE` is applied to the child's environment. Anything else
#     is logged UNSUPPORTED and skipped, so avoid PreK0sCommands/PostK0sCommands
#     that assume a shell.
#
#   * Deleting the VM raises an ACPI power button event, which k0smos honours by
#     shutting down cleanly. No extra channel is needed on KubeVirt.
